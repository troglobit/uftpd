name: Bob the Builder

# Run on all branches, including all pull requests, except the 'dev'
# branch since that's where we run Coverity Scan (limited tokens/day)
on:
  push:
    branches:
      - '**'
      - '!dev'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    # Verify we can build on latest Ubuntu with both gcc and clang
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
      fail-fast: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install tree ftp tnftp tftp-hpa python3 libuev-dev libite-dev
          # Build and run the test suite using all available cores
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=
      - name: Build
        run: |
          make V=1
      - name: Install
        run: |
          DESTDIR=~/tmp make install-strip
          tree ~/tmp
          ldd ~/tmp/sbin/uftpd
          size ~/tmp/sbin/uftpd
          ~/tmp/sbin/uftpd -h
      - name: Enable unprivileged userns (unshare)
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: |
          ulimit -n 1024
          # Each test runs in its own namespace, so they parallelize
          LD_LIBRARY_PATH=/tmp/lib make check

  package:
    # Verify the Debian packaging still builds and passes lintian.  The
    # release job runs the same target, but only after the tag is pushed
    # and immutable, so catch a broken debian/ here instead.
    name: debian
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential pkgconf libuev-dev libite-dev \
                                  devscripts debhelper lintian po-debconf
      - uses: actions/checkout@v6
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build package
        run: |
          # The suite already ran in the build job, and it needs user
          # namespaces the runner clamps down on.  dh_auto_test honours
          # nocheck, so skip it here rather than run it twice.
          DEB_BUILD_OPTIONS=nocheck make package
      - name: Inspect package
        run: |
          ls -lF ../
          dpkg -I ../uftpd_*_amd64.deb
          dpkg -c ../uftpd_*_amd64.deb
